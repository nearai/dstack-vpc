name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: vpc-api-server/go.mod
          cache-dependency-path: vpc-api-server/go.sum

      - name: Check Go formatting
        working-directory: vpc-api-server
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Test VPC API server
        working-directory: vpc-api-server
        run: go test -race -shuffle=on -count=1 ./...

      - name: Test node-name derivation
        run: bash scripts/test-node-name.sh

      - name: Test generated compose omits proxy token
        run: bash scripts/test-compose-token.sh

      - name: Check shell syntax
        run: bash -n scripts/functions.sh scripts/vpc-node-setup.sh scripts/vpc-node-entry.sh scripts/generate-compose.sh
