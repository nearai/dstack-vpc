[package]
name = "dstack-mesh"
version = "0.1.0"
authors = ["Kevin Wang <wy721@qq.com>"]
edition = "2021"
license = "MIT"

[dependencies]
rocket = { git = "https://github.com/rwf2/Rocket", branch = "master", features = ["mtls", "json"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.5"

anyhow = "1.0"

clap = { version = "4.0", features = ["derive", "env"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

figment = { version = "0.10", features = ["json", "toml"] }
git-version = "0.3"
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "hickory-dns"] }
futures-util = "0.3"
bytes = "1.0"

base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"

x509-parser = "0.16"
fs-err = "3.1.1"
tempfile = "3.8"
yasna = "0.5"
